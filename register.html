<!DOCTYPE html>
<html>

<head>

    <title>GARDNER COLLEGE LIBRARY - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2742, #6b3320, #102a43);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* ANIMATED LIBRARY BACKGROUND */

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            animation: float1 8s infinite ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 10s infinite ease-in-out;
        }

        @keyframes float1 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(60px, 40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }

        @keyframes float2 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-50px, -40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        /* FLOATING BOOK SHAPES */

        .register-box::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 90px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            left: -250px;
            top: 100px;
            transform: rotate(-15deg);
            animation: book1 6s infinite ease-in-out;
        }

        .register-box::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 85px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            right: -240px;
            bottom: 80px;
            transform: rotate(15deg);
            animation: book2 7s infinite ease-in-out;
        }

        @keyframes book1 {

            0% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(-35px) rotate(-5deg);
            }

            100% {
                transform: translateY(0) rotate(-15deg);
            }

        }

        @keyframes book2 {

            0% {
                transform: translateY(0) rotate(15deg);
            }

            50% {
                transform: translateY(30px) rotate(25deg);
            }

            100% {
                transform: translateY(0) rotate(15deg);
            }

        }


        .register-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: auto;
            height: 150px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            box-shadow: none;
        }

        .logo img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(60, 30, 10, 0.25));
        }

        /* shown only if gcd-logo.png is missing */
        .logo.nologo {
            width: 60px;
            height: 60px;
            background: #6b3320;
            color: white;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo.nologo::after { content: "GCD"; }

        h1 {
            color: #6b3320;
            font-size: 23px;
            margin-top: 15px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #243b53;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #d5d9de;
            border-radius: 6px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #6b3320;
        }

        button {
            width: 100%;
            padding: 13px;

            margin-top: 22px;

            border: none;
            border-radius: 6px;

            background: #6b3320;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4a2314;
        }

        .back {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #6b3320;
            font-weight: bold;
            text-decoration: none;
        }

.register-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

.register-text a {
    color: #6b3320;
    font-weight: bold;
    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}










        /* LIBRARY SCENE BACKGROUND (drawn by library-scene.js) */

        .scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #cfa56f;
        }

        /* the older floating circles and outlines are replaced by the scene */

        body::before,
        body::after,
        .login-box::before,
        .login-box::after,
        .register-box::before,
        .register-box::after {
            display: none;
        }

        .login-box,
        .register-box {
            box-shadow: 0 25px 60px rgba(20, 50, 90, 0.28);
            max-width: calc(100vw - 32px);
        }


    </style>

</head>


<body>

    <div class="scene" id="scene"></div>


    <div class="register-box">

        <div class="header">

            <div class="logo"><img src="gcd-logo.png" alt="GCD logo" onerror="this.parentNode.classList.add('nologo');this.remove();"></div>

            <h1>Create Student Account</h1>

            <p class="subtitle">
                Gardner College Library
            </p>

        </div>


        <form onsubmit="register(); return false;">

            <label>Full Name</label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >


            <label>Student ID</label>

            <input
                type="text"
                id="studentid"
                placeholder="Enter your student ID"
                required
            >


            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Create a username"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >
            <p style="font-size:12px;color:#777;margin-top:6px;">
                At least 8 characters, with one capital letter and one symbol such as _ * # @ !
            </p>


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirm"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="back">

            Already have an account?

            <a href="index.html">
                Sign In
            </a>

        </div>

    </div>


    <script type="module">

        import { auth, db } from "./firebase-init.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
        import { doc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

        window.register = async function () {

            var fullname =
                document.getElementById("fullname").value.trim();

            var studentid =
                document.getElementById("studentid").value.trim();

            var username =
                document.getElementById("username").value.trim();

            var email =
                document.getElementById("email").value.trim();

            var password =
                document.getElementById("password").value;

            var confirm =
                document.getElementById("confirm").value;


            /* Password rules */

            if (password.length < 8 || !/[A-Z]/.test(password) || !/[^A-Za-z0-9\s]/.test(password)) {

                alert("Password must be at least 8 characters and include one capital letter and one symbol, such as _ * # @ !");

                return;

            }


            /* Check passwords */

            if (password != confirm) {

                alert("Passwords do not match!");

                return;

            }


            var credential = null;

            try {

                /* Usernames are case-sensitive: "Maria" and "maria" are
                   two different usernames. */

                var usernameKey =
                    username;

                if (!/^[A-Za-z0-9._-]{3,30}$/.test(usernameKey)) {

                    alert("Username must be 3-30 characters: letters, numbers, dot, dash or underscore.");

                    return;

                }


                /* Check if username already exists */

                var existingSnap =
                    await getDoc(doc(db, "usernames", usernameKey));

                if (existingSnap.exists()) {

                    alert("Username already exists!");

                    return;

                }


                credential =
                    await createUserWithEmailAndPassword(auth, email, password);


                /* Every new account is a student. Admin rights can only
                   be given by editing the user's "role" in the Firebase
                   console (the security rules block anything else). */

                var batch =
                    writeBatch(db);

                batch.set(doc(db, "users", credential.user.uid), {

                    fullname: fullname,
                    studentid: studentid,
                    username: username,
                    email: email,
                    role: "student"

                });

                batch.set(doc(db, "usernames", usernameKey), {

                    email: email,
                    uid: credential.user.uid

                });

                await batch.commit();


                alert("Account created successfully!");

                window.location.href = "index.html";

            }

            catch (error) {

                /* If the login was created but saving the profile failed,
                   remove it so the person can try again cleanly. */

                if (credential) {

                    try { await credential.user.delete(); } catch (e) {}

                }

                if (error.code === "auth/email-already-in-use") {

                    alert("That email address is already registered.");

                }

                else if (error.code === "auth/weak-password") {

                    alert("Password should be at least 6 characters.");

                }

                else if (error.code === "auth/invalid-email") {

                    alert("Please enter a valid email address.");

                }

                else {

                    alert("Could not create account: " + error.message);

                }

            }

        };

    </script>

    <script src="library-scene.js"></script>

</body>


</html>
