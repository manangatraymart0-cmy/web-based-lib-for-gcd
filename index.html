<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GARDNER COLLEGE LIBRARY - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2742, #1f4e79, #102a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ANIMATED LIBRARY BACKGROUND */

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            animation: float1 8s infinite ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 10s infinite ease-in-out;
        }

        @keyframes float1 {
            0%   { transform: translate(0, 0); }
            50%  { transform: translate(60px, 40px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes float2 {
            0%   { transform: translate(0, 0); }
            50%  { transform: translate(-50px, -40px); }
            100% { transform: translate(0, 0); }
        }

        /* FLOATING BOOK SHAPES */

        .login-box::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 90px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            left: -250px;
            top: 100px;
            transform: rotate(-15deg);
            animation: book1 6s infinite ease-in-out;
        }

        .login-box::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 85px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            right: -240px;
            bottom: 80px;
            transform: rotate(15deg);
            animation: book2 7s infinite ease-in-out;
        }

        @keyframes book1 {
            0%   { transform: translateY(0) rotate(-15deg); }
            50%  { transform: translateY(-35px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(-15deg); }
        }

        @keyframes book2 {
            0%   { transform: translateY(0) rotate(15deg); }
            50%  { transform: translateY(30px) rotate(25deg); }
            100% { transform: translateY(0) rotate(15deg); }
        }

        .login-box {
            width: 400px;
            max-width: 92%;
            background: rgba(255,255,255,0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.30);
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* LOGO IMAGE */

        .logo-img {
            width: 150px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 6px 10px rgba(31, 78, 121, 0.18));
        }

        /* BACKUP LOGO */

        .logo {
            width: 60px;
            height: 60px;
            background: #1f4e79;
            color: white;
            border-radius: 10px;
            margin: auto;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(31,78,121,0.3);
        }

        .header h1 {
            margin-top: 12px;
            color: #1f4e79;
            font-size: 24px;
        }

        .header p {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #243b53;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9de;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.12);
        }

        /* PASSWORD EYE */

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 45px;
        }

        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
            font-size: 13px;
        }

        .forgot a {
            color: #1f4e79;
            font-weight: bold;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            background: #163a5c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(31,78,121,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

        .register-text {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }

        .register-text a {
            color: #1f4e79;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>

            <!-- Backup box (only shows if the logo fails to load) -->
            <div class="logo" id="logoFallback">GCD</div>

            <h1>GARDNER COLLEGE LIBRARY</h1>

            <p>Web-Based Book Borrowing System</p>

        </div>


        <form onsubmit="login(); return false;">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >


            <label>Password</label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <span class="toggle-eye" onclick="togglePassword()">👁</span>

            </div>

            <div class="forgot">
                <a href="#">Forgot your password?</a>
            </div>


            <button type="submit">
                Login
            </button>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </form>


        <div class="footer">
            GARDNER COLLEGE LIBRARY
        </div>

    </div>


    <script>

        function togglePassword() {

            var field = document.getElementById("password");

            if (field.type === "password") {
                field.type = "text";
            } else {
                field.type = "password";
            }

        }


        function login() {

            var username =
                document.getElementById("username").value;

            var password =
                document.getElementById("password").value;


            /* Check registered student account */

            var savedAccount =
                localStorage.getItem("user_" + username);


            if (savedAccount != null) {

                var account =
                    JSON.parse(savedAccount);


                if (account.password == password) {

                    localStorage.setItem(
                        "loggedInUser",
                        JSON.stringify(account)
                    );

                    window.location.href = "dashboard.html";

                }

                else {

                    alert("Incorrect password!");

                }

                return;

            }


            /* Administrator account */

            if (username == "admin" && password == "12345") {

                window.location.href = "dashboard.html";

            }

            else {

                alert("Username or password is incorrect!");

            }

        }

    </script>
